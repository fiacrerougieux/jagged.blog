<rect x="225" y="165" width="210" height="16" rx="4" fill="#555"/>
<rect x="315" y="128" width="30" height="8" fill="#111"/>
<!-- rod -->
<rect x="322" y="200" width="16" height="190" fill="#bbb"/>
<rect x="318" y="200" width="24" height="14" fill="#999"/>
<!-- filter top plate -->
<path d="M240 440 Q330 395 420 440 Z" fill="#aaa"/>
<circle cx="330" cy="418" r="4" fill="#666"/>
