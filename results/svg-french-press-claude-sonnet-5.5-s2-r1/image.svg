<ellipse cx="330" cy="610" rx="95" ry="12" fill="#aaa"/>
<path d="M240 610 L420 610 M330 598 L330 622" stroke="#555"/>
<ellipse cx="330" cy="610" rx="12" ry="5" fill="#777"/>
