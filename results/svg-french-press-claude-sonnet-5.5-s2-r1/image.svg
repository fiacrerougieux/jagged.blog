<g fill="none"><ellipse cx="330" cy="475" rx="85" ry="9"/><ellipse cx="330" cy="485" rx="85" ry="9"/><ellipse cx="330" cy="495" rx="85" ry="9"/></g>
<!-- mesh -->
<ellipse cx="330" cy="550" rx="100" ry="14" fill="#e6e6e6"/>
<ellipse cx="330" cy="550" rx="100" ry="14" fill="url(#m)"/>
