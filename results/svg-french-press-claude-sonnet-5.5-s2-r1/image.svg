<path d="M230 665 L230 950 Q230 975 255 975 L405 975 Q430 975 430 950 L430 665 Z" fill="#cfe6ee" fill-opacity=".6"/>
<ellipse cx="330" cy="665" rx="100" ry="10" fill="#e8f4f8"/>
<path d="M230 665 L215 655 L230 650" fill="none"/>
<!-- frame -->
<path d="M240 1040 L240 1140 M420 1040 L420 1140 M330 1040 L330 1140" fill="none" stroke-width="0"/>
<ellipse cx="330" cy="1045" rx="108" ry="12" fill="none" stroke-width="5"/>
<path d="M222 1045 L232 1130 M438 1045 L428 1130 M262 1055 L268 1135 M398 1055 L392 1135" fill="none" stroke-width="5"/>
<path d="M222 1130 Q222 1150 330 1150 Q438 1150 438 1130 L438 1120 L222 1120 Z" fill="#777"/>
<rect x="236" y="1148" width="26" height="16" fill="#333"/><rect x="398" y="1148" width="26" height="16" fill="#333"/>
<path d="M438 1050 Q520 1040 515 1085 Q510 1120 432 1120 L432 1105 Q490 1100 490 1085 Q490 1065 438 1068 Z" fill="#333"/>
</g>
<defs><pattern id="m" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0L6 6M6 0L0 6" stroke="#777" stroke-width=".8"/></pattern></defs>
<g stroke="#666" stroke-width="1"><path d="M352 75H580M435 160H580M342 300H580M400 425H580M415 485H580M430 550H580M425 610H580M430 800H580M530 1090H580" fill="none"/></g>
<g>
<text x="588" y="80">1 Knob</text>
<text x="588" y="165">2 Lid</text>
<text x="588" y="305">3 Plunger rod</text>
<text x="588" y="430">4 Top filter plate</text>
