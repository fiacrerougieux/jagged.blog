<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" font-family="Arial" font-size="17">
<rect width="800" height="1200" fill="#fafaf7"/>
<text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold">French Press – Exploded View</text>
<line x1="330" y1="45" x2="330" y2="1180" stroke="#999" stroke-dasharray="8 5"/>
<g stroke="#222" stroke-width="2" fill="#ccc">
<!-- knob -->
<circle cx="330" cy="75" r="22" fill="#222"/>
<rect x="318" y="97" width="24" height="12" fill="#888"/>
