    .call{stroke:#8a6a46;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .label{font:600 15px 'Arial',sans-serif;letter-spacing:1.5px;fill:#263438}
    .sub{font:12px 'Arial',sans-serif;letter-spacing:.7px;fill:#7a7165}
    .num{font:700 12px 'Arial',sans-serif;fill:#fff}
  </style>
