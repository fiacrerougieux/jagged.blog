<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A cup of coffee, stirred</title>
<style>
  :root{
    /* 3.2s chosen so the four judged moments (0.4/1.2/2.0/2.8s)
       land on four different points of the circle. */
    --spin: 0.7s;
  }

  html, body { margin: 0; height: 100%; }

  body{
    background:
      radial-gradient(circle at 50% 40%, #fdfbf7 0%, #f1ece2 42%, #e0d7c7 100%);
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  .scene{
    position: relative;
    width: 400px;
    height: 400px;
  }

  /* ---------------- saucer ---------------- */
  .saucer{
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 43% 33%, #ffffff 0%, #f6f2ea 42%, #e0d9cb 76%, #c7bda9 100%);
    box-shadow:
      0 24px 36px rgba(70,48,24,.32),
      0 6px 10px rgba(70,48,24,.20),
      inset 0 -10px 18px rgba(120,100,70,.20),
      inset 0 10px 16px rgba(255,255,255,.95);
  }
  .saucer::after{
    content: "";
    position: absolute; inset: 36px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #f2eee5 0%, #e6e0d3 100%);
    box-shadow:
      inset 0 4px 7px rgba(120,100,70,.28),
      inset 0 -3px 5px rgba(255,255,255,.85);
  }

  /* ---------------- cup ---------------- */
  .cup{
    position: absolute; inset: 52px; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 42%, #ffffff 0%, #f5f2ec 58%, #ded8cd 100%);
    box-shadow:
      0 16px 24px rgba(70,48,24,.38),
      inset 0 -7px 13px rgba(120,100,70,.28),
      inset 0 7px 11px rgba(255,255,255,.95);
  }
  .rim{
    position: absolute; inset: 62px; border-radius: 50%;
    background: linear-gradient(145deg, #fbf8f2 0%, #d6d0c4 100%);
    box-shadow:
      inset 0 5px 9px rgba(0,0,0,.30),
      inset 0 -2px 4px rgba(255,255,255,.9),
      0 2px 4px rgba(255,255,255,.7);
  }

  /* ---------------- coffee ---------------- */
  .coffee{
    position: absolute; inset: 70px; border-radius: 50%; overflow: hidden;
    background:
      radial-gradient(circle at 42% 34%, #8c5a31 0%, #673d1c 34%, #43230f 68%, #2a1307 100%);
    box-shadow:
      inset 0 0 26px 8px rgba(18,7,0,.8),
      inset 0 8px 14px rgba(0,0,0,.7);
  }
  /* soft angular streaks from the stirring */
  .swirl{
    position: absolute; inset: -30%;
    background:
      repeating-conic-gradient(from 0deg,
        rgba(255,228,190,0)   0deg,
        rgba(205,148,94,.20)  12deg,
        rgba(40,19,5,.20)     27deg,
        rgba(255,228,190,0)   44deg);
    filter: blur(4px);
    animation: spin var(--spin) linear infinite;
  }
  /* marbled crema blobs churning the other way */
  .marbles{
    position: absolute; inset: -30%;
    background:
      radial-gradient(ellipse 22% 9% at 26% 30%, rgba(235,190,140,.55), rgba(235,190,140,0) 70%),
      radial-gradient(ellipse 26% 10% at 68% 22%, rgba(215,165,115,.50), rgba(215,165,115,0) 70%),
      radial-gradient(ellipse 24% 9% at 80% 62%, rgba(240,195,145,.45), rgba(240,195,145,0) 70%),
      radial-gradient(ellipse 22% 8% at 40% 82%, rgba(205,155,105,.50), rgba(205,155,105,0) 70%),
      radial-gradient(ellipse 18% 7% at 12% 58%, rgba(230,185,135,.40), rgba(230,185,135,0) 70%);
    filter: blur(6px);
    animation: spin calc(var(--spin) * 0.62) linear infinite reverse;
    opacity: .85;
  }
  /* keeps the point where all the swirl bands meet from glowing */
  .core{
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgba(34,15,3,.82) 0%, rgba(34,15,3,.40) 12%, rgba(34,15,3,0) 32%);
  }
  .gloss{
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(ellipse 36% 21% at 35% 27%, rgba(255,255,255,.38), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 52% 32% at 63% 73%, rgba(255,214,168,.20), rgba(255,214,168,0) 72%);
  }
  .crema{
    position: absolute; inset: 0; border-radius: 50%;
    box-shadow:
      inset 0 0 0 5px rgba(214,166,116,.40),
      inset 0 0 20px 5px rgba(255,222,175,.16);
  }

  /* ---------------- spoon ---------------- */
  .spoon{
    position: absolute;
    left: 50%; top: 50%;
    width: 0; height: 0;
    transform-origin: 0 0;
    animation: spin var(--spin) linear infinite;
    z-index: 6;
  }
  /* soft shadow of the bowl sitting in the liquid */
  .spoon-shadow{
    position: absolute;
    left: -30px; top: -119px;
    width: 60px; height: 72px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(20,8,0,.5), rgba(20,8,0,0) 70%);
    filter: blur(5px);
    transform: translate(7px, 9px);
  }
  /* the ring of disturbed liquid around the bowl */
  .wake{
    position: absolute;
    left: -35px; top: -124px;
    width: 70px; height: 82px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(255,222,175,0) 52%, rgba(255,222,175,.30) 66%, rgba(255,222,175,0) 80%);
    filter: blur(3px);
  }
  .handle{
    position: absolute;
    left: -8.5px; top: -175px;
    width: 17px; height: 72px;
    background: linear-gradient(90deg,
      #4f565d 0%, #9aa1a7 16%, #f6f9fb 40%, #cbd0d5 56%, #7d848b 80%, #464d54 100%);
    clip-path: polygon(50% 0%, 82% 5%, 82% 12%, 57% 100%, 43% 100%, 18% 12%, 18% 5%);
    filter: drop-shadow(0 3px 3px rgba(20,10,0,.55));
  }
  .bowl{
    position: absolute;
    left: -22px; top: -114px;
    width: 44px; height: 62px;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 42% 30%,
        #fbfdfe 0%, #d3d8dd 24%, #9aa1a8 52%, #6a7178 78%, #464d54 100%);
    box-shadow:
      0 5px 9px rgba(15,7,0,.55),
      inset 0 -5px 9px rgba(0,0,0,.45),
      inset 0 5px 8px rgba(255,255,255,.95),
      inset 0 0 0 3px rgba(255,255,255,.45);
  }
  /* concave interior: dark metal catching a warm reflection of the coffee */
  .bowl::after{
    content: "";
    position: absolute; inset: 5px 6px 6px 6px;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 60% 70%, rgba(210,160,110,.5), rgba(210,160,110,0) 55%),
      radial-gradient(ellipse at 38% 30%, #b9c0c6 0%, #7f868d 34%, #545b62 66%, #343a40 100%);
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,.6),
      inset 0 -2px 4px rgba(255,255,255,.35);
  }
  /* bright specular glint on the bowl */
  .bowl::before{
    content: "";
    position: absolute; left: 8px; top: 8px;
    width: 13px; height: 20px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%);
    transform: rotate(-18deg);
    z-index: 2;
  }
  /* little drops flung off the spoon while stirring */
  .drop{
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #b98047, #4d2b13 75%);
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
    animation: twinkle var(--spin) ease-in-out infinite;
  }
  .drop.a{ left: 30px; top: -30px; width: 9px; height: 8px; }
  .drop.b{ left: -46px; top: -70px; width: 7px; height: 6px; animation-delay: -1.1s; }
  .drop.c{ left: 52px; top: -92px; width: 6px; height: 5px; animation-delay: -2.2s; }
  .drop.d{ left: -16px; top: 44px; width: 6px; height: 5px; animation-delay: -0.6s; }
  .drop.e{ left: 44px; top: 18px; width: 7px; height: 6px; animation-delay: -1.7s; }

  @keyframes spin{ to { transform: rotate(360deg); } }
  @keyframes twinkle{
    0%, 100% { opacity: .15; transform: scale(.7); }
    50%      { opacity: 1;   transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="saucer"></div>
    <div class="cup"></div>
    <div class="rim"></div>

    <div class="coffee">
      <div class="swirl"></div>
      <div class="marbles"></div>
      <div class="core"></div>
      <div class="crema"></div>
      <div class="gloss"></div>
    </div>

    <div class="spoon">
      <div class="spoon-shadow"></div>
      <div class="wake"></div>
      <div class="handle"></div>
      <div class="bowl"></div>
      <div class="drop a"></div>
      <div class="drop b"></div>
      <div class="drop c"></div>
      <div class="drop d"></div>
      <div class="drop e"></div>
    </div>
  </div>
</body>
</html>
