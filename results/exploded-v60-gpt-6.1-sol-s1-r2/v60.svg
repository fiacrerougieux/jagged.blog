<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1240" viewBox="0 0 1100 1240">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e5d8bb"/><stop offset=".45" stop-color="#fff7e6"/><stop offset="1" stop-color="#ecdfc4"/></linearGradient>
    <linearGradient id="paperInside" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6ecd8"/><stop offset="1" stop-color="#d6c3a0"/></linearGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#cbd8d9"/><stop offset=".32" stop-color="#f8fcf9"/><stop offset=".63" stop-color="#eff5f2"/><stop offset="1" stop-color="#bacdd0"/></linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b2c8ca"/><stop offset="1" stop-color="#e9f1ed"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d6e6e6" stop-opacity=".8"/><stop offset=".22" stop-color="#f8fcf9" stop-opacity=".35"/><stop offset=".7" stop-color="#edf5f1" stop-opacity=".25"/><stop offset="1" stop-color="#bfd5d7" stop-opacity=".65"/></linearGradient>
