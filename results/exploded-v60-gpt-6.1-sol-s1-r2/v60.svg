    <g font-size="13" font-weight="700" fill="#c66b43" letter-spacing="2"><text x="772" y="289">01</text><text x="772" y="615">02</text><text x="772" y="954">03</text></g>
    <g fill="#263e44" font-size="24" font-weight="600"><text x="771" y="323">Paper filter</text><text x="771" y="649">V60 dripper</text><text x="771" y="988">Glass server</text></g>
    <g fill="#63777a" font-size="15"><text x="772" y="350">Disposable conical paper</text><text x="772" y="374">Seats inside the dripper</text><text x="772" y="676">Spiral-ribbed ceramic cone</text><text x="772" y="700">Single outlet · 60° angle</text><text x="772" y="1015">Heat-resistant glass</text><text x="772" y="1039">Dripper rests on open neck</text></g>
  </g>
  <path d="M70 1168 H1030" stroke="#d7dbd3"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#63777a"><text x="70" y="1198" letter-spacing="1.5">ASSEMBLY ORDER</text><text x="250" y="1198">Server → dripper → paper filter</text><text x="1030" y="1198" text-anchor="end">Schematic · not to scale</text></g>
</svg>