    <text x="67" y="117" font-size="45" font-weight="600" letter-spacing="-1.5">V60 pour-over</text>
    <text x="70" y="150" font-size="16" fill="#63777a">Exploded view · paper-filter setup</text>
    <text x="1027" y="69" text-anchor="end" font-size="13" fill="#63777a" letter-spacing="2">FIG. 01</text>
  </g>
  <path d="M70 176 H1030" stroke="#d7dbd3"/>
  <!-- Shared assembly axis, visible only between components. -->
  <g fill="none" stroke="#c66b43" stroke-width="1.6" stroke-dasharray="4 7">
    <path d="M450 196 V223"/>
    <path d="M450 414 V446" marker-end="url(#arrow)"/>
    <path d="M450 751 V804" marker-end="url(#arrow)"/>
  </g>
  <!-- 01: open paper cone. The inset ellipse is the open mouth, not a lid. -->
