  <g stroke="#759295" stroke-width="1.5" fill="none"><path d="M494 977 H532 M507 999 H532 M494 1021 H532 M507 1043 H532"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#759295"><text x="540" y="981">500</text><text x="540" y="1025">300</text><text x="499" y="1065" letter-spacing="1">mL</text></g>
  <!-- Numbered callouts: fine horizontal leaders and aligned text. -->
  <g fill="none" stroke="#a4aeaa" stroke-width="1.2">
    <path d="M584 310 H744"/><path d="M532 636 H744"/><path d="M688 975 H744"/>
