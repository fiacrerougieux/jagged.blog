        <path d="M378 549 C381 599 419 669 456 712"/>
        <path d="M430 554 C427 607 443 674 464 710"/>
        <path d="M483 552 C467 609 467 674 470 707"/>
        <path d="M534 547 C507 604 493 665 477 703"/>
        <path d="M580 536 C548 595 519 654 483 700"/>
