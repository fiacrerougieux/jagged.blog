    <g fill="none" stroke="#8daaad" stroke-width="2" opacity=".7">
      <path d="M309 472 Q321 497 365 509"/><path d="M353 459 Q361 491 398 513"/>
      <path d="M403 454 Q401 488 432 517"/><path d="M454 453 Q440 488 465 517"/>
      <path d="M505 455 Q477 491 497 515"/><path d="M553 463 Q518 495 529 511"/>
