  <path d="M717 511 C784 515 818 527 871 527 L1009 527 Q1028 526 1037 518" fill="none" stroke="#4e301f" stroke-width="2" opacity=".6"/>
  <path d="M760 495q20 12 1 29M785 493q18 14 2 34M811 492q17 15 2 38" fill="none" stroke="#dfaa74" stroke-width="1.2" opacity=".45"/>
  <ellipse cx="1039" cy="507" rx="9" ry="15" fill="#654127" stroke="#d5a16d" stroke-width="1.5"/>
 </g>
 <!-- separate double spout assembly below head -->
 <g filter="url(#shadow)">
  <!-- threaded inlet and central manifold -->
  <path d="M487 567L533 567L529 592Q527 600 520 606L510 613L500 606Q493 600 491 592Z" fill="url(#steel)" stroke="#45555c" stroke-width="2"/>
  <path d="M493 574h34M492 581h34M493 588h32" stroke="#59696e" stroke-width="2"/>
  <path d="M500 602 C495 615 480 620 463 628 C448 635 443 648 445 662 L448 681 Q450 690 460 690 Q470 690 471 680 L470 659 Q469 653 478 649 L510 635 L542 649 Q551 653 550 659 L549 680 Q550 690 560 690 Q570 690 572 681 L575 662 C577 648 572 635 557 628 C540 620 525 615 520 602Z" fill="url(#steelDark)" stroke="#45555c" stroke-width="2.2"/>
  <path d="M453 650Q461 646 471 651M549 651Q559 646 567 650" fill="none" stroke="#f1f3ef" stroke-width="2" opacity=".85"/>
  <!-- two distinct outlet lips -->
  <ellipse cx="459" cy="684" rx="12" ry="6" fill="#45545a" stroke="#dce3df" stroke-width="2"/>
  <ellipse cx="561" cy="684" rx="12" ry="6" fill="#45545a" stroke="#dce3df" stroke-width="2"/>
  <ellipse cx="459" cy="684" rx="6" ry="2.5" fill="#1c2b31"/>
  <ellipse cx="561" cy="684" rx="6" ry="2.5" fill="#1c2b31"/>
  <path d="M482 611Q510 620 538 611" fill="none" stroke="#f3f5f0" stroke-width="1.5" opacity=".7"/>
 </g>
 <!-- labels left -->
 <g>
  <text class="label" x="66" y="214">01  FILTER BASKET</text><text class="sub" x="66" y="235">Removable, perforated stainless cup</text>
  <path class="leader" d="M284 227H350L391 245"/><circle class="dot" cx="391" cy="245" r="3"/>
  <text class="label" x="66" y="383">02  RETAINING SPRING</text><text class="sub" x="66" y="404">Seats basket securely in the head</text>
  <path class="leader" d="M286 396H375L427 391"/><circle class="dot" cx="427" cy="391" r="3"/>
  <text class="label" x="66" y="535">03  PORTAFILTER BODY</text><text class="sub" x="66" y="556">Locking lugs engage the group head</text>
  <path class="leader" d="M294 546H327L355 487"/><circle class="dot" cx="355" cy="487" r="3"/>
 </g>
 <!-- labels right -->
 <g>
  <text class="label" x="805" y="622">04  DOUBLE SPOUT</text><text class="sub" x="805" y="643">One inlet divides into two outlets</text>
  <path class="leader" d="M795 635H690L573 656"/><circle class="dot" cx="573" cy="656" r="3"/>
  <text class="label" x="856" y="560">05  SCREW-ON HANDLE</text><text class="sub" x="856" y="581">Turned hardwood grip</text>
  <path class="leader" d="M850 568H817L808 529"/><circle class="dot" cx="808" cy="529" r="3"/>
 </g>
 <path d="M58 770H1142" stroke="#c9d0cd" stroke-width="1"/>
 <text x="60" y="798" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.3" fill="#8b9697">EXPLODED VIEW  ·  COMPONENTS SEPARATED ALONG INSERTION AXIS</text>
 <text x="1140" y="798" text-anchor="end" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.3" fill="#8b9697">ILLUSTRATIVE — NOT TO SCALE</text>
</svg>
