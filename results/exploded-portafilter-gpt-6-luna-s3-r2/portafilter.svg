  <!-- ears / bayonet lugs -->
  <path d="M405 466L350 453Q338 451 337 463L335 482Q335 491 347 493L406 498Z" fill="url(#steelDark)" stroke="#46565d" stroke-width="2"/>
  <path d="M615 466L670 453Q682 451 683 463L685 482Q685 491 673 493L614 498Z" fill="url(#steelDark)" stroke="#46565d" stroke-width="2"/>
  <!-- cylindrical head -->
  <path d="M405 450 Q510 420 615 450 L615 508 Q510 538 405 508Z" fill="url(#steelDark)" stroke="#425259" stroke-width="2"/>
  <ellipse cx="510" cy="450" rx="105" ry="31" fill="url(#steel)" stroke="#425259" stroke-width="2"/>
  <ellipse cx="510" cy="450" rx="88" ry="22" fill="#58676c" stroke="#e2e8e5" stroke-width="2"/>
  <ellipse cx="510" cy="450" rx="77" ry="16" fill="#26373e" stroke="#89979a" stroke-width="1"/>
  <path d="M410 451Q510 479 610 451" fill="none" stroke="#f1f3ee" stroke-width="2" opacity=".65"/>
  <!-- ear highlights -->
  <path d="M343 463l57 12M679 463l-57 12" stroke="#f0f3ef" stroke-width="2" opacity=".75"/>
  <!-- threaded handle boss -->
  <path d="M608 477h52q15 0 21 11l9 14-13 17h-68z" fill="url(#steel)" stroke="#45555c" stroke-width="2"/>
  <path d="M656 481v34M664 482v32M672 489v20" stroke="#586970" stroke-width="2"/>
 </g>
 <!-- handle, extending right -->
 <g filter="url(#shadow)">
  <path d="M683 491 C738 489 780 482 824 480 L1009 480 Q1038 480 1049 495 Q1057 508 1047 521 Q1038 533 1013 535 L823 535 Q777 530 682 517Z" fill="url(#wood)" stroke="#533620" stroke-width="2.4"/>
