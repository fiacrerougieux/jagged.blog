<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
 <defs>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66747b"/><stop offset=".18" stop-color="#e3e9e8"/><stop offset=".42" stop-color="#9ba8aa"/><stop offset=".68" stop-color="#f4f6f3"/><stop offset="1" stop-color="#75848a"/></linearGradient>
  <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dce3e2"/><stop offset=".45" stop-color="#8e9b9e"/><stop offset="1" stop-color="#4a5a61"/></linearGradient>
  <linearGradient id="basket" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65747a"/><stop offset=".2" stop-color="#e7ece9"/><stop offset=".5" stop-color="#aeb9b8"/><stop offset=".77" stop-color="#f2f3ef"/><stop offset="1" stop-color="#647279"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#633b25"/><stop offset=".28" stop-color="#bd8050"/><stop offset=".56" stop-color="#98603a"/><stop offset=".82" stop-color="#c18a58"/><stop offset="1" stop-color="#57331f"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="holes" width="17" height="13" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.45" fill="#45545a" opacity=".78"/><circle cx="12" cy="10" r="1.25" fill="#45545a" opacity=".65"/></pattern>
  <style>.label{font:600 15px 'Arial',sans-serif;letter-spacing:1.7px;fill:#26363d}.sub{font:12px 'Arial',sans-serif;letter-spacing:.6px;fill:#728087}.leader{fill:none;stroke:#76868b;stroke-width:1.4}.dot{fill:#bd7948}.fine{fill:none;stroke:#e9efed;stroke-width:1.5;opacity:.7}.dash{stroke:#98a5a8;stroke-width:1.2;stroke-dasharray:4 7;opacity:.75}</style>
 </defs>
 <rect width="1200" height="850" fill="#f5f4ef"/>
 <path d="M55 109H1145" stroke="#c9d0cd" stroke-width="1"/>
 <text x="58" y="58" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#24343b">PORTAFILTER</text>
 <text x="59" y="84" font-family="Arial,sans-serif" font-size="12" letter-spacing="2.4" fill="#738087">EXPLODED ASSEMBLY  /  DOUBLE-SPOUT • REMOVABLE BASKET</text>
 <text x="1140" y="61" text-anchor="end" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.7" fill="#879397">ESPRESSO HARDWARE  ·  01</text>
 <text x="1140" y="83" text-anchor="end" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4" fill="#a1aaa9">PARTS SHOWN IN ASSEMBLY ORDER</text>
 <!-- exploded alignment -->
 <path class="dash" d="M510 147V724"/>
 <path d="M500 159l10-13 10 13M500 711l10 13 10-13" fill="none" stroke="#9ba7a8" stroke-width="1.2"/>
 <!-- removable basket -->
