  <!-- perforated tapered wall -->
  <path d="M400 208 Q510 235 620 208 L594 327 Q510 351 426 327Z" fill="url(#basket)" stroke="#536269" stroke-width="2"/>
  <path d="M414 223 Q510 247 606 223 L585 320 Q510 340 435 320Z" fill="url(#holes)" opacity=".93"/>
  <path d="M426 327 Q510 351 594 327 Q510 372 426 327Z" fill="url(#steelDark)" stroke="#536269" stroke-width="1.5"/>
  <ellipse cx="510" cy="207" rx="112" ry="31" fill="url(#steel)" stroke="#45545b" stroke-width="2"/>
  <ellipse cx="510" cy="207" rx="98" ry="22" fill="#58676c" stroke="#f0f2ed" stroke-width="2"/>
  <ellipse cx="510" cy="207" rx="87" ry="16" fill="#a9b4b2" opacity=".7"/>
  <path d="M403 209Q510 238 617 209" fill="none" stroke="#f7f8f4" stroke-width="2" opacity=".85"/>
 </g>
 <!-- basket lip marks -->
 <path d="M421 238Q510 261 599 238M428 270Q510 291 592 270M434 299Q510 318 586 299" fill="none" stroke="#eef1ed" stroke-width="1" opacity=".55"/>
 <!-- retaining spring, exploded below basket -->
 <g filter="url(#shadow)">
  <ellipse cx="510" cy="391" rx="82" ry="19" fill="none" stroke="#46575e" stroke-width="8"/>
  <ellipse cx="510" cy="391" rx="82" ry="19" fill="none" stroke="url(#steel)" stroke-width="5"/>
  <path d="M584 381q19 1 16 13q-3 9-17 9" fill="none" stroke="#58686e" stroke-width="5" stroke-linecap="round"/>
  <path d="M588 381q12 3 9 11" fill="none" stroke="#eef1ec" stroke-width="1.5"/>
 </g>
 <!-- portafilter head with locking ears -->
