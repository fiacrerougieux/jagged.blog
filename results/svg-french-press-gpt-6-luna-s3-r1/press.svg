 <path d="M451 424H683 M451 448H683 M451 506H683 M451 554H683 M451 636H683" stroke="#d9e0df" stroke-width="1" stroke-dasharray="4 7"/>
 <!-- numbered labels and leaders -->
 <g><path class="leader" d="M602 132 L776 132 L816 158"/><circle cx="836" cy="158" r="14" fill="#2f6970"/><text class="num" x="836" y="163" text-anchor="middle">1</text><text class="label" x="860" y="155">Plunger knob</text><text class="small" x="860" y="175">fixed to the stainless-steel rod</text></g>
 <g><path class="leader" d="M682 366 L774 366 L817 344"/><circle cx="837" cy="344" r="14" fill="#2f6970"/><text class="num" x="837" y="349" text-anchor="middle">2</text><text class="label" x="861" y="341">Lid</text><text class="small" x="861" y="361">slips over the rod</text></g>
 <g><path class="leader" d="M665 480 L770 480 L814 467"/><circle cx="834" cy="467" r="14" fill="#2f6970"/><text class="num" x="834" y="472" text-anchor="middle">3</text><text class="label" x="858" y="464">Coil spring</text><text class="small" x="858" y="484">edge seal around the filter</text></g>
 <g><path class="leader" d="M666 530 L765 530 L812 548"/><circle cx="832" cy="548" r="14" fill="#2f6970"/><text class="num" x="832" y="553" text-anchor="middle">4</text><text class="label" x="856" y="545">Fine mesh screen</text><text class="small" x="856" y="565">captures coffee grounds</text></g>
 <g><path class="leader" d="M665 588 L747 588 L794 635"/><circle cx="814" cy="635" r="14" fill="#2f6970"/><text class="num" x="814" y="640" text-anchor="middle">5</text><text class="label" x="838" y="632">Perforated plate</text><text class="small" x="838" y="652">supports the mesh</text></g>
 <g><path class="leader" d="M389 805 L284 805 L247 785"/><circle cx="227" cy="785" r="14" fill="#2f6970"/><text class="num" x="227" y="790" text-anchor="middle">6</text><text class="label" x="62" y="781">Glass carafe</text><text class="small" x="62" y="801">with pouring spout</text></g>
 <g><path class="leader" d="M930 838 L1010 838"/><circle cx="1030" cy="838" r="14" fill="#2f6970"/><text class="num" x="1030" y="843" text-anchor="middle">7</text><text class="label" x="1054" y="835">Handle</text><text class="small" x="1054" y="855">heat-safe grip</text></g>
