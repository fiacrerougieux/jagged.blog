<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100">
 <defs>
  <linearGradient id="glass" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d8eef0" stop-opacity=".62"/><stop offset=".18" stop-color="#f7ffff" stop-opacity=".24"/><stop offset=".52" stop-color="#b9dce0" stop-opacity=".13"/><stop offset=".84" stop-color="#eefbfc" stop-opacity=".44"/><stop offset="1" stop-color="#a8d0d5" stop-opacity=".58"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset=".22" stop-color="#9eafb5"/><stop offset=".48" stop-color="#f2f6f7"/><stop offset=".76" stop-color="#8b9ba1"/><stop offset="1" stop-color="#dce4e6"/></linearGradient>
  <linearGradient id="darksteel" x1="0" x2="1"><stop stop-color="#52666d"/><stop offset=".45" stop-color="#d4dfe1"/><stop offset="1" stop-color="#73878d"/></linearGradient>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0L8 8M8 0L0 8" stroke="#73868c" stroke-width=".65" opacity=".7"/></pattern>
  <pattern id="holes" width="22" height="16" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#52676e"/><circle cx="17" cy="13" r="2.2" fill="#52676e"/></pattern>
  <filter id="shadow" x="-.2" y="-.3" width="1.4" height="1.7"><feGaussianBlur stdDeviation="5"/></filter>
  <style>
   .label{font:600 17px 'Arial',sans-serif;fill:#20333a;letter-spacing:.25px}.small{font:13px 'Arial',sans-serif;fill:#53666c}.num{font:700 14px 'Arial',sans-serif;fill:#fff}.leader{fill:none;stroke:#73878c;stroke-width:1.5}.metal{stroke:#52666d;stroke-width:1.6}.fine{fill:none;stroke:#9bb0b5;stroke-width:1.5}
  </style>
 </defs>
 <rect width="1200" height="1100" fill="#f7f8f5"/>
