  <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#6f8790"/><stop offset=".22" stop-color="#e4e8e5"/><stop offset=".46" stop-color="#859ca1"/><stop offset=".7" stop-color="#f5f3eb"/><stop offset="1" stop-color="#536973"/></linearGradient>
  <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#c1d5d7" stop-opacity=".65"/><stop offset=".19" stop-color="#e6eeeb" stop-opacity=".23"/><stop offset=".63" stop-color="#fff" stop-opacity=".08"/><stop offset=".88" stop-color="#b2ced1" stop-opacity=".36"/><stop offset="1" stop-color="#97b5be" stop-opacity=".63"/></linearGradient>
