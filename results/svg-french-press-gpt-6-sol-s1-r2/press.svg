  <clipPath id="screenClip"><ellipse cx="620" cy="858" rx="161" ry="35"/></clipPath>
  <clipPath id="glassClip"><path d="M430 1095 Q438 1285 458 1455 Q465 1481 620 1481 Q775 1481 782 1455 Q802 1285 810 1095Z"/></clipPath>
  <style>
   text{fill:#283b43;font-family:Arial,Helvetica,sans-serif} .small{font-size:14px;letter-spacing:2.4px;font-weight:700} .micro{font-size:12px;letter-spacing:1.9px} .num{font:italic 25px Georgia,serif;fill:#b45e3c} .label{font-size:17px;letter-spacing:1.1px;font-weight:700} .detail{font-size:12px;letter-spacing:1.3px;fill:#748389} .call{fill:none;stroke:#8da0a2;stroke-width:1.3} .edge{stroke:#344e57;stroke-width:2.2;stroke-linejoin:round} .thin{fill:none;stroke:#516b74;stroke-width:1.2} .ghost{stroke:#c4c9c5;stroke-width:1.2;stroke-dasharray:5 8;fill:none}
