<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1600" viewBox="0 0 1200 1600">
<title>French press — exploded assembly</title>
<desc>Technical exploded view of a French press with lid and plunger, spiral spring plate, fine mesh screen, cross plate and glass carafe.</desc>
<defs>
