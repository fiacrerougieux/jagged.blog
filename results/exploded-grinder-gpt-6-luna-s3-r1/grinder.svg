    .fine{stroke:#38575b;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;fill:none}
    .dash{stroke:#668185;stroke-width:1.5;stroke-dasharray:6 7;fill:none}
    .label{font:600 17px 'Arial',sans-serif;letter-spacing:1.3px;fill:#20383d}
    .sub{font:13px 'Arial',sans-serif;letter-spacing:1.1px;fill:#6a7775}
    .num{font:700 14px 'Arial',sans-serif;fill:#f6f1e5;text-anchor:middle;dominant-baseline:middle}
  </style>
</defs>
