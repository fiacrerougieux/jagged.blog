  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c452c"/><stop offset=".48" stop-color="#c17a4a"/><stop offset="1" stop-color="#8b4e30"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1d3940"/><stop offset=".5" stop-color="#315961"/><stop offset="1" stop-color="#19343a"/></linearGradient>
  <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9c5a39"/><stop offset=".5" stop-color="#d18b5b"/><stop offset="1" stop-color="#8b4c32"/></linearGradient>
