<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="1080" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Exploded view: manual coffee grinder with conical burrs</text>

  <g transform="translate(60,40)">
    <!-- exploded-axis guide -->
    <line x1="400" y1="20" x2="400" y2="1000" stroke="#999" stroke-width="1.2" stroke-dasharray="8,5"/>

    <!-- 9 drive shaft (square end) -->
    <rect x="390" y="830" width="20" height="70" fill="#b8bcc2" stroke="#333" stroke-width="1.5"/>
    <rect x="384" y="830" width="32" height="10" fill="#9aa0a8" stroke="#333" stroke-width="1.5"/>

    <!-- 8 spring -->
    <polyline points="400,790 385,797 415,804 385,811 415,818 385,825 400,830" fill="none" stroke="#333" stroke-width="2"/>

    <!-- 10 retaining ring / bearing -->
    <rect x="360" y="900" width="80" height="16" rx="4" fill="#9aa0a8" stroke="#333" stroke-width="1.5"/>
    <rect x="382" y="916" width="36" height="8" fill="#b8bcc2" stroke="#333" stroke-width="1.2"/>

    <!-- 11 catch cup -->
    <path d="M300,935 L500,935 L488,1000 L312,1000 Z" fill="#dfe6ec" stroke="#333" stroke-width="1.5"/>
    <path d="M300,935 L500,935 L498,948 L302,948 Z" fill="#c4ceD8" stroke="#333" stroke-width="1.2"/>

    <!-- 7 main housing -->
    <rect x="280" y="672" width="240" height="98" rx="10" fill="#e4e4e4" stroke="#333" stroke-width="1.5"/>
    <rect x="300" y="690" width="200" height="6" fill="none" stroke="#777" stroke-width="1"/>
    <rect x="300" y="740" width="200" height="6" fill="none" stroke="#777" stroke-width="1"/>

    <!-- 6 burr carrier -->
    <ellipse cx="400" cy="592" rx="110" ry="12" fill="#cfd4da" stroke="#333" stroke-width="1.5"/>
    <path d="M290,592 L290,650 Q290,660 300,660 L500,660 Q510,660 510,650 L510,592" fill="#d4d9df" stroke="#333" stroke-width="1.5"/>

    <!-- 5 outer (female) burr ring, fixed -->
    <polygon points="270,470 530,470 460,560 340,560" fill="#b5884f" stroke="#333" stroke-width="1.5"/>
    <polygon points="318,470 482,470 430,560 370,560" fill="#f5f0e6" stroke="#333" stroke-width="1.2"/>
    <line x1="318" y1="470" x2="370" y2="560" stroke="#333" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- 4 inner (male) conical burr -->
    <polygon points="380,340 420,340 490,430 310,430" fill="#c99a5e" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="400" cy="340" rx="20" ry="5" fill="#8a6038" stroke="#333" stroke-width="1"/>
    <line x1="360" y1="370" x2="440" y2="370" stroke="#6b4a26" stroke-width="1"/>
    <line x1="340" y1="400" x2="460" y2="400" stroke="#6b4a26" stroke-width="1"/>

    <!-- 3 hopper -->
    <ellipse cx="400" cy="185" rx="100" ry="10" fill="#f2f5f8" stroke="#333" stroke-width="1.5"/>
    <path d="M300,185 L370,290 L430,290 L500,185 Z" fill="#eef2f6" stroke="#333" stroke-width="1.5"/>
    <rect x="370" y="290" width="60" height="18" fill="#dde3ea" stroke="#333" stroke-width="1.5"/>

    <!-- 2 adjustment dial -->
    <rect x="350" y="110" width="100" height="40" rx="6" fill="#8d959e" stroke="#333" stroke-width="1.5"/>
    <g stroke="#333" stroke-width="1.5">
      <line x1="362" y1="110" x2="362" y2="120"/>
      <line x1="376" y1="110" x2="376" y2="120"/>
      <line x1="390" y1="110" x2="390" y2="120"/>
      <line x1="410" y1="110" x2="410" y2="120"/>
      <line x1="424" y1="110" x2="424" y2="120"/>
      <line x1="438" y1="110" x2="438" y2="120"/>
    </g>

    <!-- 1 crank handle -->
    <rect x="250" y="50" width="300" height="16" rx="7" fill="#5c646e" stroke="#333" stroke-width="1.5"/>
    <circle cx="400" cy="58" r="22" fill="#a0a7b0" stroke="#333" stroke-width="1.5"/>
    <circle cx="552" cy="58" r="14" fill="#2f3640" stroke="#333" stroke-width="1.5"/>

    <!-- leader lines and labels -->
    <g stroke="#555" stroke-width="1" fill="none">
      <line x1="566" y1="58" x2="630" y2="58"/>
      <line x1="350" y1="130" x2="172" y2="130"/>
      <line x1="478" y1="230" x2="630" y2="230"/>
      <line x1="338" y1="385" x2="172" y2="385"/>
      <line x1="503" y1="515" x2="630" y2="515"/>
      <line x1="288" y1="620" x2="172" y2="620"/>
      <line x1="538" y1="725" x2="630" y2="725"/>
      <line x1="368" y1="805" x2="172" y2="805"/>
      <line x1="418" y1="865" x2="630" y2="865"/>
      <line x1="358" y1="908" x2="172" y2="908"/>
      <line x1="496" y1="970" x2="630" y2="970"/>
    </g>
    <g font-size="15" fill="#222">
      <text x="637" y="63"><tspan font-weight="bold">1</tspan>  Crank handle</text>
      <text x="160" y="135" text-anchor="end"><tspan font-weight="bold">2</tspan>  Adjustment dial</text>
      <text x="637" y="235"><tspan font-weight="bold">3</tspan>  Hopper</text>
      <text x="160" y="390" text-anchor="end"><tspan font-weight="bold">4</tspan>  Inner conical burr (male)</text>
      <text x="637" y="520"><tspan font-weight="bold">5</tspan>  Outer conical burr (female)</text>
      <text x="160" y="625" text-anchor="end"><tspan font-weight="bold">6</tspan>  Burr carrier</text>
      <text x="637" y="730"><tspan font-weight="bold">7</tspan>  Main body / housing</text>
      <text x="160" y="810" text-anchor="end"><tspan font-weight="bold">8</tspan>  Adjustment spring</text>
      <text x="637" y="870"><tspan font-weight="bold">9</tspan>  Drive shaft (square end)</text>
      <text x="160" y="913" text-anchor="end"><tspan font-weight="bold">10</tspan>  Retaining ring / bearing</text>
      <text x="637" y="975"><tspan font-weight="bold">11</tspan>  Catch cup</text>
    </g>
  </g>

  <text x="450" y="1062" text-anchor="middle" font-size="13" fill="#555">Parts shown along the drive axis (dashed). Inner burr (4) is driven by the shaft (9); outer burr (5) is locked in the carrier (6).</text>
</svg>
