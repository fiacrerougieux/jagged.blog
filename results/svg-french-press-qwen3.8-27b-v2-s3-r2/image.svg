<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="460" height="720" fill="#ffffff"/>

  <!-- centerline -->
  <line x1="230" y1="28" x2="230" y2="700" stroke="#b6bcc6" stroke-width="1" stroke-dasharray="16 5 3 5"/>

  <text x="14" y="24" font-size="16" fill="#111827" font-weight="bold">French press &#8212; exploded view</text>

  <!-- ============ 1. Plunger knob ============ -->
  <g>
    <path d="M216,40 v26 a14,5 0 0 0 28,0 v-26" fill="#4b5563" stroke="#1f2937" stroke-width="1.5"/>
    <ellipse cx="230" cy="40" rx="14" ry="5" fill="#6b7280" stroke="#1f2937" stroke-width="1.5"/>
  </g>

  <!-- ============ 2. Lid ============ -->
  <g>
    <path d="M135,105 v40 a95,14 0 0 0 190,0 v-40" fill="#52525b" stroke="#27272a" stroke-width="2"/>
    <ellipse cx="230" cy="105" rx="95" ry="14" fill="#71717a" stroke="#27272a" stroke-width="2"/>
    <ellipse cx="230" cy="105" rx="16" ry="5.5" fill="#3f3f46" stroke="#27272a" stroke-width="1.5"/>
  </g>

  <!-- ============ 3. Plunger stem ============ -->
  <g>
    <rect x="226" y="172" width="8" height="128" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
    <rect x="222" y="168" width="16" height="8" rx="3" fill="#4b5563" stroke="#1f2937" stroke-width="1.5"/>
  </g>

  <!-- ============ 4. Wire mesh screen ============ -->
  <defs>
    <clipPath id="screenClip">
      <ellipse cx="230" cy="350" rx="92" ry="20"/>
    </clipPath>
  </defs>
  <g>
    <g clip-path="url(#screenClip)" stroke="#9aa3af" stroke-width="1">
      <line x1="138" y1="334" x2="322" y2="334"/>
      <line x1="138" y1="341" x2="322" y2="341"/>
      <line x1="138" y1="348" x2="322" y2="348"/>
      <line x1="138" y1="355" x2="322" y2="355"/>
      <line x1="138" y1="362" x2="322" y2="362"/>
      <line x1="148" y1="328" x2="148" y2="372"/>
      <line x1="158" y1="328" x2="158" y2="372"/>
      <line x1="168" y1="328" x2="168" y2="372"/>
      <line x1="178" y1="328" x2="178" y2="372"/>
      <line x1="188" y1="328" x2="188" y2="372"/>
      <line x1="198" y1="328" x2="198" y2="372"/>
      <line x1="208" y1="328" x2="208" y2="372"/>
      <line x1="218" y1="328" x2="218" y2="372"/>
      <line x1="228" y1="328" x2="228" y2="372"/>
      <line x1="238" y1="328" x2="238" y2="372"/>
      <line x1="248" y1="328" x2="248" y2="372"/>
      <line x1="258" y1="328" x2="258" y2="372"/>
      <line x1="268" y1="328" x2="268" y2="372"/>
      <line x1="278" y1="328" x2="278" y2="372"/>
      <line x1="288" y1="328" x2="288" y2="372"/>
      <line x1="298" y1="328" x2="298" y2="372"/>
      <line x1="308" y1="328" x2="308" y2="372"/>
    </g>
    <ellipse cx="230" cy="350" rx="92" ry="20" fill="none" stroke="#4b5563" stroke-width="3"/>
  </g>

  <!-- ============ 5. Flange disc ============ -->
  <g>
    <path d="M133,415 v23 a97,16 0 0 0 194,0 v-23" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <ellipse cx="230" cy="415" rx="97" ry="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <ellipse cx="230" cy="415" rx="7" ry="3" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  </g>

  <!-- ============ 6. Glass carafe ============ -->
  <g>
    <!-- spout -->
    <path d="M143,506 C 122,501 104,504 94,513 C 92,517 97,521 106,521 C 118,521 132,520 143,519 Z"
          fill="#dbeafe" fill-opacity="0.55" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- body -->
    <path d="M138,510 C 133,570 131,636 143,668 Q 230,692 317,668 C 329,636 327,570 322,510 Z"
          fill="#dbeafe" fill-opacity="0.55" stroke="#64748b" stroke-width="2.5"/>
    <ellipse cx="230" cy="510" rx="92" ry="13" fill="#eff6ff" fill-opacity="0.7" stroke="#64748b" stroke-width="2.5"/>
    <!-- glass highlight -->
    <path d="M162,532 C 158,580 158,620 165,650" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M178,528 C 176,560 175,590 177,615" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- handle -->
    <path d="M322,545 C 366,550 370,625 316,634" fill="none" stroke="#374151" stroke-width="9" stroke-linecap="round"/>
    <path d="M322,545 C 366,550 370,625 316,634" fill="none" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ============ labels ============ -->
  <g font-size="13" fill="#374151">
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="122" y1="52"  x2="213" y2="52"/>
      <line x1="122" y1="125" x2="132" y2="125"/>
      <line x1="122" y1="236" x2="223" y2="236"/>
      <line x1="122" y1="350" x2="135" y2="350"/>
      <line x1="122" y1="426" x2="130" y2="426"/>
      <line x1="122" y1="590" x2="133" y2="590"/>
    </g>
    <text x="116" y="56"  text-anchor="end">Plunger knob</text>
    <text x="116" y="129" text-anchor="end">Lid</text>
    <text x="116" y="240" text-anchor="end">Stem</text>
    <text x="116" y="354" text-anchor="end">Mesh screen</text>
    <text x="116" y="430" text-anchor="end">Flange disc</text>
    <text x="116" y="594" text-anchor="end">Glass carafe</text>
  </g>
</svg>
