<text x="842" y="253" class="name">Plunger knob + rod</text>
<text x="842" y="280" class="detail">Threaded stainless-steel shaft</text>
<text x="842" y="358" class="name">Lid</text>
<text x="842" y="385" class="detail">Guides the sliding plunger</text>
<!-- Three-piece filter bracket -->
<path d="M744 582H755V1017H744" fill="none" stroke="#bdc8b7" stroke-width="1.5"/>
<g><circle cx="830" cy="621" r="14" fill="#375b4b"/><text x="830" y="626" class="num">1</text><circle cx="830" cy="785" r="14" fill="#375b4b"/><text x="830" y="790" class="num">2</text><circle cx="830" cy="939" r="14" fill="#375b4b"/><text x="830" y="944" class="num">3</text></g>
<text x="855" y="627" class="name">Spiral plate</text>
<text x="842" y="658" class="detail">Coiled spring seals the filter</text>
<text x="842" y="681" class="detail">against the glass wall.</text>
<text x="855" y="791" class="name">Mesh screen</text>
<text x="842" y="822" class="detail">Fine woven stainless steel</text>
<text x="842" y="845" class="detail">keeps grounds in the beaker.</text>
<text x="855" y="945" class="name">Cross plate</text>
<text x="842" y="976" class="detail">Rigid backing supports</text>
<text x="842" y="999" class="detail">the mesh under pressure.</text>
<text x="842" y="1055" class="name">Retaining nut</text>
<text x="842" y="1082" class="detail">Clamps the three-piece stack</text>
<text x="842" y="1258" class="name">Glass beaker</text>
<text x="842" y="1285" class="detail">Pouring spout + insulated handle</text>
<text x="842" y="1318" class="detail">Filter slides inside the cylinder;</text>
<text x="842" y="1341" class="detail">the lid rests on the open rim.</text>
