 <path d="M397 282 C397 310 466 333 550 333 S703 310 703 282" fill="none" stroke="#f4f8f9" stroke-width="3"/>
 <path d="M414 321 L431 376" fill="none" stroke="#f0f5f6" stroke-width="2"/>
</g>
