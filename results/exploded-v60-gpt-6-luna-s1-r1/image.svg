  <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2=".25"><stop stop-color="#153f46"/><stop offset=".3" stop-color="#286873"/><stop offset=".62" stop-color="#367b83"/><stop offset="1" stop-color="#17464f"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#cce1df" stop-opacity=".3"/><stop offset=".22" stop-color="#f8ffff" stop-opacity=".68"/><stop offset=".73" stop-color="#d7eded" stop-opacity=".28"/><stop offset="1" stop-color="#b8d6d5" stop-opacity=".62"/></linearGradient>
