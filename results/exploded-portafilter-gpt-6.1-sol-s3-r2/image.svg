<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#829c9e"/><stop offset=".18" stop-color="#d3dede"/><stop offset=".36" stop-color="#f8fbf7"/><stop offset=".61" stop-color="#b4c5c5"/><stop offset=".85" stop-color="#edf3ee"/><stop offset="1" stop-color="#728d90"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7faf5"/><stop offset="1" stop-color="#a9bdbd"/></linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#536d71"/><stop offset=".55" stop-color="#9aafb0"/><stop offset="1" stop-color="#dde6e0"/></linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3e5659"/><stop offset=".4" stop-color="#233a3f"/><stop offset="1" stop-color="#10292e"/></linearGradient>
    <pattern id="holes" width="12" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.45" fill="#466468"/><circle cx="9" cy="8" r="1.45" fill="#466468"/></pattern>
    <style>
      .edge{stroke:#29474b;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
      .fine{fill:none;stroke:#637e80;stroke-width:1.25;stroke-linecap:round}
      .leader{fill:none;stroke:#748c89;stroke-width:1.2;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#203d42}
      .sub{font-family:Arial,Helvetica,sans-serif;fill:#607875;font-size:14px}
      .num{font-family:Arial,Helvetica,sans-serif;fill:#087e78;font-size:13px;font-weight:bold;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="1040" fill="#f5f3eb"/>
  <path d="M48 119H1152" stroke="#c9d2c8"/>
  <text x="48" y="48" class="num" font-size="12" letter-spacing="3">COMPONENT STUDY / 01</text>
  <text x="48" y="87" class="label" font-size="35" font-weight="bold" letter-spacing="-1">Espresso portafilter</text>
  <text x="1152" y="59" text-anchor="end" class="sub">DOUBLE-SPOUT ASSEMBLY</text>
  <text x="1152" y="83" text-anchor="end" class="sub">Exploded view · basket removed</text>

  <!-- Common vertical assembly axis -->
  <path d="M480 145V954" stroke="#84aaa3" stroke-width="1.3" stroke-dasharray="7 7"/>

  <!-- 01: Removable filter basket, drawn with an open lip and perforated floor -->
  <g class="edge">
    <path d="M345 202C346 234 357 284 370 317C396 359 563 359 590 317C602 283 613 235 615 202Z" fill="url(#steel)"/>
    <path d="M371 317C398 350 562 350 589 317" fill="none" stroke="#718e90" stroke-width="1.2"/>
    <path d="M361 215C365 253 374 281 380 297M599 215C595 252 587 279 580 297" stroke="#f9fcf5" fill="none" stroke-width="3"/>
    <ellipse cx="480" cy="202" rx="141" ry="46" fill="url(#rim)"/>
    <ellipse cx="480" cy="201" rx="126" ry="35" fill="url(#inside)"/>
    <path d="M354 201C366 226 393 254 480 254C567 254 594 226 606 201" fill="none" stroke="#819a9b" stroke-width="1.2"/>
    <ellipse cx="480" cy="219" rx="104" ry="23" fill="#c7d5ce" stroke="#8a9f9d" stroke-width="1"/>
    <ellipse cx="480" cy="219" rx="99" ry="20" fill="url(#holes)" stroke="none"/>
    <path d="M346 197C371 150 586 150 614 197" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  </g>

  <!-- 02: Split retaining spring -->
  <ellipse cx="480" cy="415" rx="128" ry="35" fill="none" stroke="#29474b" stroke-width="6" stroke-dasharray="510 55" transform="rotate(-8 480 415)"/>
  <ellipse cx="480" cy="413" rx="128" ry="35" fill="none" stroke="#d2dfd8" stroke-width="2" stroke-dasharray="510 55" transform="rotate(-8 480 413)"/>

  <!-- 03: Closed portafilter body and bayonet ears -->
  <g class="edge">
    <!-- Rear locking ear -->
    <path d="M546 517L587 492L624 505L627 522L590 548Z" fill="url(#steel)"/>
    <path d="M546 517L587 492L624 505L582 532Z" fill="#dae4dd"/>
    <!-- Bowl is solid underneath; coffee drains into the threaded outlet -->
    <path d="M330 548L339 615C344 650 383 678 445 686H515C578 678 617 650 622 615L630 548Z" fill="url(#steel)"/>
    <path d="M355 593C361 644 404 661 447 666" fill="none" stroke="#f6faf3" stroke-width="4"/>
    <path d="M348 628C395 674 565 674 613 628" fill="none" stroke="#7e9797" stroke-width="1.3"/>
    <!-- Left locking ear -->
    <path d="M332 546L292 556L290 575L338 589L373 576L374 558Z" fill="url(#steel)"/>
    <path d="M332 546L292 556L338 571L374 558Z" fill="#dce6df"/>
    <!-- Mounting socket / neck -->
    <path d="M611 551L665 527L690 536L699 558L643 586L620 578Z" fill="url(#steel)"/>
    <path d="M657 530L674 522L696 535L704 554L687 564L670 549Z" fill="#91a9a8"/>
    <!-- Rim and cavity -->
    <ellipse cx="480" cy="548" rx="151" ry="53" fill="url(#rim)"/>
    <ellipse cx="480" cy="548" rx="128" ry="37" fill="url(#inside)"/>
    <ellipse cx="480" cy="559" rx="102" ry="23" fill="#879f9f" stroke="#71898a" stroke-width="1"/>
    <ellipse cx="480" cy="561" rx="18" ry="6" fill="#29474b" stroke="#bdceca" stroke-width="1.5"/>
    <path d="M354 550C377 579 581 584 606 550" fill="none" stroke="#c4d3cb" stroke-width="1.4"/>
    <path d="M339 537C375 486 582 485 621 537" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Spring seat inside the mouth -->
    <path d="M357 542C378 507 581 507 603 542" fill="none" stroke="#4b6c6e" stroke-width="2"/>
    <!-- Threaded outlet underneath the closed bowl -->
    <path d="M454 684V711C455 723 505 723 506 711V684" fill="url(#steel)"/>
    <path d="M455 692Q480 702 505 692M455 699Q480 709 505 699M455 706Q480 716 505 706" fill="none" stroke="#5f7e80" stroke-width="1.5"/>
    <ellipse cx="480" cy="714" rx="25" ry="8" fill="#9fb4b1"/>
  </g>

  <!-- Handle, kept attached to the body -->
  <g class="edge">
    <path d="M683 532L739 500L757 512L763 533L706 567C689 567 677 544 683 532Z" fill="url(#steel)"/>
    <path d="M701 524C703 539 710 550 722 557M711 518C713 533 720 544 732 551" fill="none" stroke="#6d8787" stroke-width="1.3"/>
    <path d="M730 501C744 489 770 482 790 472L971 378C992 367 1028 376 1044 401C1057 422 1051 448 1030 459L826 553C799 566 777 580 758 571C736 561 721 523 730 501Z" fill="url(#grip)"/>
    <path d="M750 506L983 389C1000 381 1018 387 1028 399" fill="none" stroke="#657e7b" stroke-width="3"/>
    <path d="M762 553L1029 432" fill="none" stroke="#142d32" stroke-width="3"/>
    <path d="M973 378C965 396 981 440 1005 470" fill="none" stroke="#40595b" stroke-width="1.2"/>
  </g>

  <!-- 04: Removable double-spout casting -->
  <g class="edge">
    <!-- Female socket receives body outlet -->
    <path d="M450 797V831L438 843H522L510 831V797Z" fill="url(#steel)"/>
    <ellipse cx="480" cy="797" rx="30" ry="10" fill="#d8e3dc"/>
    <ellipse cx="480" cy="797" rx="21" ry="6" fill="#4d6d71" stroke-width="1.2"/>
    <path d="M459 796Q480 803 501 796" fill="none" stroke="#9cb3af" stroke-width="1"/>
    <!-- Broad Y distributor, with two downward-facing outlets -->
    <path d="M446 827C430 838 398 846 360 850L350 863L351 908C352 925 391 926 396 910L401 880C427 879 453 871 480 858C507 871 533 879 559 880L564 910C569 926 608 925 609 908L610 863L600 850C562 846 530 838 514 827C497 820 463 820 446 827Z" fill="url(#steel)"/>
    <path d="M446 827C430 838 398 846 360 850L350 863C397 868 443 853 480 842C517 853 563 868 610 863L600 850C562 846 530 838 514 827C497 820 463 820 446 827Z" fill="url(#rim)"/>
    <path d="M362 876V904M597 876V904" fill="none" stroke="#f6faf4" stroke-width="3"/>
    <ellipse cx="374" cy="910" rx="22" ry="9" fill="#9eb3b1"/>
    <ellipse cx="374" cy="911" rx="14" ry="5" fill="#24474c" stroke-width="1.2"/>
    <ellipse cx="586" cy="910" rx="22" ry="9" fill="#9eb3b1"/>
    <ellipse cx="586" cy="911" rx="14" ry="5" fill="#24474c" stroke-width="1.2"/>
  </g>

  <!-- Callouts -->
  <g>
    <text x="48" y="222" class="num">01</text>
    <text x="83" y="222" class="label" font-size="19" font-weight="bold">Filter basket</text>
    <text x="83" y="245" class="sub">Removable · perforated base</text>
    <path d="M83 262H267L349 239" class="leader"/><circle cx="349" cy="239" r="3" fill="#087e78"/>

    <text x="48" y="392" class="num">02</text>
    <text x="83" y="392" class="label" font-size="19" font-weight="bold">Retaining spring</text>
    <text x="83" y="415" class="sub">Seats in the body's inner groove</text>
    <path d="M83 432H285L354 414" class="leader"/><circle cx="354" cy="414" r="3" fill="#087e78"/>

    <text x="48" y="624" class="num">03</text>
    <text x="83" y="624" class="label" font-size="19" font-weight="bold">Portafilter body</text>
    <text x="83" y="647" class="sub">Closed bowl · bayonet locking ears</text>
    <path d="M83 666H282L345 622" class="leader"/><circle cx="345" cy="622" r="3" fill="#087e78"/>

    <text x="48" y="822" class="num">04</text>
    <text x="83" y="822" class="label" font-size="19" font-weight="bold">Double spout</text>
    <text x="83" y="845" class="sub">Thread-on · two coffee outlets</text>
    <path d="M83 865H277L355 874" class="leader"/><circle cx="355" cy="874" r="3" fill="#087e78"/>

    <path d="M867 506L908 602H1065" class="leader"/><circle cx="867" cy="506" r="3" fill="#087e78"/>
    <text x="918" y="630" class="label" font-size="19" font-weight="bold">Handle</text>
    <text x="918" y="653" class="sub">Shown attached</text>

    <path d="M506 703H719" class="leader"/><circle cx="506" cy="703" r="3" fill="#087e78"/>
    <text x="735" y="708" class="sub">Threaded outlet</text>
    <text x="735" y="730" class="sub">Feeds the removable spout below</text>
  </g>
  <path d="M48 978H1152" stroke="#c9d2c8"/>
  <text x="48" y="1007" class="sub" font-size="12">ASSEMBLY ORDER   04 → 03 → 02 → 01</text>
  <text x="1152" y="1007" text-anchor="end" class="sub" font-size="12">Schematic · not to scale</text>
</svg>